<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- First circle (source) -->
  <circle cx="80" cy="100" r="40" stroke="#4ade80" stroke-width="5" fill="none" opacity="0.6"/>
  <!-- Second circle (destination) -->
  <circle cx="120" cy="100" r="40" stroke="#4ade80" stroke-width="5" fill="none" opacity="0.6"/>
  <!-- Intersection/transition zone (filled to show overlap) -->
  <path d="M100 60 A40 40 0 0 1 100 140 A40 40 0 0 1 100 60" fill="#4ade80" opacity="0.25"/>
  <!-- Center connecting line (transition path) -->
  <line x1="100" y1="70" x2="100" y2="130" stroke="#4ade80" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Arrow indicators (flow direction) -->
  <path d="M90 95 L100 100 L90 105" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 95 L100 100 L110 105" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
